# Builds the Vayro desktop app for Mac and Windows on GitHub's machines.
#
#   Actions → "Desktop app" → Run workflow   builds the installers (download them from "Artifacts")
#   push a version tag, e.g.  v1.0.1        builds them AND publishes a GitHub Release with them;
#                                            the site's "Download for Mac" button reads that Release
#
# The installers get fixed names (the site looks for exactly these):
#   Vayro-mac-apple-silicon.dmg · Vayro-mac-intel.dmg · Vayro-windows-setup.exe
#
# Private code repository? Visitors can't download from its Releases. Publish to a separate PUBLIC
# repository instead: set the repository variable RELEASES_REPO (e.g. "you/vayro-releases") and the
# secret RELEASES_TOKEN (a token allowed to write to that repository's contents). See DESKTOP.md.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            os: macos-latest
            args: --mac --arm64 -c.mac.artifactName=Vayro-mac-apple-silicon.dmg
          - name: mac-intel
            os: macos-latest
            args: --mac --x64 -c.mac.artifactName=Vayro-mac-intel.dmg
            # Intel Macs: install the x64 builds of the native speech-model libraries
            cpu: x64
          - name: windows
            os: windows-latest
            args: --win --x64 -c.nsis.artifactName=Vayro-windows-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci ${{ matrix.cpu && format('--cpu={0}', matrix.cpu) || '' }} --foreground-scripts
      - name: Build the site
        run: npm run build
      - name: Package
        env:
          # no Apple / Windows signing certificate yet: build unsigned (ad-hoc on Mac)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: vayro-${{ matrix.name }}
          path: |
            release/Vayro-mac-*.dmg
            release/Vayro-windows-setup.exe
          if-no-files-found: error

  release:
    # only for version tags (v1.0.1, …): attach the installers to a GitHub Release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vayro ${{ github.ref_name }}
          make_latest: 'true'
          files: |
            installers/Vayro-mac-apple-silicon.dmg
            installers/Vayro-mac-intel.dmg
            installers/Vayro-windows-setup.exe
          fail_on_unmatched_files: false
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
