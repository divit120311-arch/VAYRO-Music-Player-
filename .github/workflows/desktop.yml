# Builds the Vayro app for macOS on GitHub's Mac machines. (Windows has no desktop app: Windows
# users use Vayro in the browser — the website on Vercel, which this workflow doesn't touch.)
#
#   Actions → "macOS app" → Run workflow   builds the .dmg files (download them from "Artifacts")
#   push a version tag, e.g.  v1.0.2      builds them AND publishes a GitHub Release with them;
#                                          the site's "Download for Mac" button reads that Release
#
# Pushes to main don't run this (only tags and manual runs).
#
# The files get fixed names (the site looks for exactly these):
#   Vayro-mac-apple-silicon.dmg (M1/M2/M3/M4…) · Vayro-mac-intel.dmg (Intel Macs)
#
# Private code repository? Visitors can't download from its Releases. Publish to a separate PUBLIC
# repository instead: set the repository variable RELEASES_REPO (e.g. "you/vayro-releases") and the
# secret RELEASES_TOKEN (a token allowed to write to that repository's contents). See DESKTOP.md.
name: macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            args: --mac --arm64 -c.mac.artifactName=Vayro-mac-apple-silicon.dmg
          - name: mac-intel
            args: --mac --x64 -c.mac.artifactName=Vayro-mac-intel.dmg
            # Intel Macs: install the x64 builds of the native speech-model libraries
            cpu: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci ${{ matrix.cpu && format('--cpu={0}', matrix.cpu) || '' }} --foreground-scripts
      - name: Build the site
        run: npm run build
      - name: Package
        env:
          # no Apple signing certificate yet: ad-hoc signed (see DESKTOP.md for Developer ID + notarization)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: vayro-${{ matrix.name }}
          path: release/Vayro-mac-*.dmg
          if-no-files-found: error

  release:
    # only for version tags (v1.0.2, …): attach the .dmg files to a GitHub Release
    # (still publishes whichever Mac build succeeded if the other one failed)
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vayro ${{ github.ref_name }} for Mac
          make_latest: 'true'
          files: |
            installers/Vayro-mac-apple-silicon.dmg
            installers/Vayro-mac-intel.dmg
          fail_on_unmatched_files: false
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
